/* Layout: eine ruhige Spalte. Start mit Testzusammenstellung, dann Fortschrittsband mit einem Segment je Frage, Frage, Antworten, Erklärung, am Ende Auswertung. */
:root {
  --bg: #eef2f2;
  --surface: #ffffff;
  --ink: #17262b;
  --muted: #55676c;
  --line: #d3dcdd;
  --accent: #245b6b;
  --accent-ink: #1b4654;
  --accent-soft: #dbe9ed;
  --on-accent: #ffffff;
  --ok: #26704a;
  --ok-soft: #dcefe3;
  --bad: #a93a2a;
  --bad-soft: #f6e0db;
  --warn: #7a4e00;
  --warn-soft: #f7ebd0;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111a1d;
    --surface: #1a2529;
    --ink: #e5eef0;
    --muted: #9aadb2;
    --line: #2d3d42;
    --accent: #7db6c6;
    --accent-ink: #a9d3df;
    --accent-soft: #20383f;
    --on-accent: #0f1b1f;
    --ok: #6fc690;
    --ok-soft: #1a3427;
    --bad: #f08c7a;
    --bad-soft: #3a211d;
    --warn: #e8bd6a;
    --warn-soft: #362b14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111a1d;
  --surface: #1a2529;
  --ink: #e5eef0;
  --muted: #9aadb2;
  --line: #2d3d42;
  --accent: #7db6c6;
  --accent-ink: #a9d3df;
  --accent-soft: #20383f;
  --on-accent: #0f1b1f;
  --ok: #6fc690;
  --ok-soft: #1a3427;
  --bad: #f08c7a;
  --bad-soft: #3a211d;
  --warn: #e8bd6a;
  --warn-soft: #362b14;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 500; text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
a { color: var(--accent-ink); text-underline-offset: 2px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* Start */
.hero { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
.hero h1 { font-size: clamp(32px, 8vw, 44px); letter-spacing: -.01em; }
.hero .lead { font-size: 16px; max-width: 58ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.panel h2 { font-size: 20px; }
.panel h3 { font-size: 17px; }
.legend { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.legend li { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 420px) { .legend li { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
.facts { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.facts span { font-size: 13px; color: var(--muted); }
.facts b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

/* Einstellungen */
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
legend { padding: 0; font-weight: 600; font-size: 14px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg label { position: relative; flex: 1 1 0; min-width: 0; }
.seg input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.seg span { display: flex; flex-direction: column; gap: 2px; align-items: center; justify-content: center; text-align: center; min-height: 48px; padding: 8px 6px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); font-weight: 600; }
.seg small { font-size: 12px; font-weight: 500; opacity: .85; }
.seg input:checked + span { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.topics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 460px) { .topics { grid-template-columns: minmax(0, 1fr); } }
.topic { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); cursor: pointer; min-height: 48px; }
.topic input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.topic .cnt { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.topic:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.topic:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.topicbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.linkbtn { font: inherit; font-size: 13px; font-weight: 600; background: none; border: 0; color: var(--accent-ink); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; padding: 6px 4px; min-height: 36px; }
.info { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.info b { font-variant-numeric: tabular-nums; }

/* Chips */
.chip { display: inline-block; font-size: 12px; font-weight: 600; line-height: 1; padding: 6px 9px; border-radius: 4px; letter-spacing: .02em; white-space: nowrap; width: fit-content; }

.notice { background: var(--warn-soft); border: 1px solid var(--warn); border-left-width: 6px; border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }

.fold summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; padding: 12px 18px; font-family: var(--font-display); font-size: 18px; font-weight: 500; }
.fold summary::-webkit-details-marker { display: none; }

.fold[open] summary::after { transform: rotate(-135deg); margin-top: 4px; }
.fold summary:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; border-radius: 10px; }
.foldbody { display: flex; flex-direction: column; gap: 12px; padding: 0 18px 18px; }
.foldbody.foot { font-size: 13.5px; }

/* Topbar */
.topbar { display: flex; flex-direction: column; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding-block: 8px; z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
.topline { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.score { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
.score b { color: var(--ink); font-size: 18px; font-weight: 700; }
.ticks { display: flex; gap: 3px; }
.tick { flex: 1 1 0; min-width: 0; height: 6px; border-radius: 3px; background: var(--line); }
.tick.cur { background: var(--accent); }
.tick.ok { background: var(--ok); }
.tick.bad { background: var(--bad); }

/* Frage */
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px 18px; display: flex; flex-direction: column; gap: 16px; }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }

.hint { font-size: 13px; color: var(--muted); }

.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .ltr { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.right .ltr { background: var(--ok); border-color: var(--ok); color: var(--surface); }

.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }

      "Zu diesem Thema gibt es bislang keine aussagekräftigen Studien, deshalb bleibt die WHO-Empfehlung weitgehend unbelegt.",
      "In allen Studien zeigt sich ein klarer Überlebensvorteil gegenüber der Standardversorgung."],
  a: [0],
  e: "Die bekannte Studie von Temel et al. (2010) zeigte bei Lungenkrebs bessere Lebensqualität und Stimmung und ein längeres Überleben. Der Überlebensvorteil wurde in anderen Studien nicht durchgehend bestätigt. Vorteile für die Lebensqualität sind besser belegt.",
  m: "Früh und begleitend: ja. Ein sicherer Überlebensvorteil: nicht für alle Gruppen belegt.",
  u: "Die Evidenz ist uneinheitlich. Studien unterscheiden sich in Erkrankung, Setting und Intervention.",
  s: ["WHODEF", "TEMEL"] },

{ c: "grund", k: ["definition"],
  q: "Herr A. (79, Prostatakrebs) hat starke Schmerzen. Er sorgt sich um seine Frau, fühlt sich allein und fragt nach dem Sinn. Welches Konzept beschreibt das am besten?",
  o: ["Total Pain: Leiden hat körperliche, psychische, soziale und spirituelle Anteile, die sich beeinflussen.",
      "Breakthrough Pain: kurzzeitige Schmerzspitzen, die trotz gleichmäßiger Basismedikation auftreten.",
      "Phantomschmerz: Schmerzempfinden in einem Körperteil, der nicht mehr vorhanden ist.",
      "Somatische Fixierung: Beschwerden werden vorrangig auf körperliche Ursachen zurückgeführt und behandelt."],
  a: [0],
  e: "Total Pain geht auf Cicely Saunders zurück und prägte die Hospizbewegung. Es erklärt, warum Angst, Einsamkeit oder Sinnfragen Schmerzen verstärken können und warum ein Team aus mehreren Berufsgruppen nötig ist.",
  m: "Leiden hat vier Dimensionen: körperlich, psychisch, sozial, spirituell.",
  s: ["WHO"] },

{ c: "grund", k: ["definition"],
  q: "Welche Merkmale gehören zur WHO-Definition von Palliative Care?",
  o: ["Sie versteht das Sterben als normalen Prozess und will den Tod weder beschleunigen noch hinauszögern.",
      "Sie beschränkt sich auf die Behandlung körperlicher Symptome und überlässt anderes Fachleuten.",
      "Sie bezieht Angehörige ein, bei Bedarf auch in der Zeit der Trauer nach dem Tod.",
      "Sie beginnt erst dann, wenn eine Heilung der Erkrankung nicht mehr möglich erscheint."],
  a: [0, 2],
  e: "Palliative Care umfasst körperliche, psychosoziale und spirituelle Aspekte und wird im Team geleistet. Sie kann früh im Krankheitsverlauf beginnen. Ein Beschleunigen des Todes gehört nicht dazu, die Tötung auf Verlangen ist in Deutschland strafbar (§ 216 StGB).",
  m: "Weder beschleunigen noch hinauszögern. Team, Angehörige, alle Dimensionen des Leidens.",
  s: ["WHODEF", "STGB216"] },

{ c: "grund", k: ["konsens", "verbindlich"],
  q: "Was unterscheidet eine Palliativstation von einem stationären Hospiz?",
  o: ["Die Palliativstation gehört zum Krankenhaus und strebt Symptomkontrolle und möglichst eine Entlassung an.",
      "Die Palliativstation nimmt überwiegend Menschen mit Krebs auf, das Hospiz vor allem andere Erkrankungen.",
      "Das Hospiz ist ein Lebensort ohne Krankenhausbehandlung und wird überwiegend durch Spenden finanziert.",
      "Die Palliativstation arbeitet ohne Pflegekräfte, weil dort überwiegend ärztliche Behandlung stattfindet und gesteuert wird."],
  a: [0],
  e: "Auf der Palliativstation wird stabilisiert, viele Betroffene gehen anschließend nach Hause oder in eine Einrichtung. Ins Hospiz kommen Menschen mit begrenzter Lebenserwartung, die keine Krankenhausbehandlung brauchen, aber zu Hause nicht versorgt werden können. Die Krankenkassen tragen den größten Teil der Kosten, Spenden ergänzen.",
  m: "Palliativstation: Krankenhaus mit Ziel Stabilisierung. Hospiz: Lebensort in der letzten Phase.",
  s: ["SGB39A", "GKVHOSP"] },

{ c: "grund", k: ["verbindlich", "konsens"],
  q: "Frau H. (90) im Heim bekommt kaum Besuch und hat Angst vor den Nächten. Was kann ein ambulanter Hospizdienst leisten?",
  o: ["Ehrenamtliche begleiten sie mit Zeit, Gesprächen und Anwesenheit und entlasten so auch Pflegekräfte.",
      "Ehrenamtliche übernehmen die Grundpflege und geben Medikamente, damit das Pflegeteam spürbar entlastet wird.",
      "Ehrenamtliche entscheiden gemeinsam mit der Ärztin, ob einzelne Therapien beendet werden.",
      "Ehrenamtliche ersetzen nachts das Palliativteam, sodass der Hintergrunddienst entfallen kann."],
  a: [0],
  e: "Ehrenamtliche ergänzen Pflege und Medizin, ohne sie zu ersetzen. Sie übernehmen keine pflegerischen oder ärztlichen Aufgaben. Die Förderung ambulanter Hospizdienste ist in § 39a SGB V geregelt.",
  m: "Ehrenamt ergänzt, ersetzt keine Pflege und ärztliche Versorgung.",
  s: ["SGB39A"] },

{ c: "grund", k: ["leitlinie", "konsens"],
  q: "Wie werden Therapieziele in der Palliativversorgung am besten festgelegt?",
  o: ["Gemeinsam mit den Betroffenen, an deren Werten orientiert, und bei veränderter Lage erneut überprüft.",
      "Einmal bei der Aufnahme durch das ärztliche Team, danach bleiben sie unverändert bestehen.",
      "Nach den Wünschen der Angehörigen, weil Betroffene oft nicht mehr klar entscheiden können.",
      "Nach den Standardvorgaben der Einrichtung, damit alle Bewohnerinnen und Bewohner gleich behandelt werden."],
  a: [0],
  e: "Therapieziele sind dynamisch und ändern sich mit Verlauf, Belastung und persönlichen Prioritäten. Maßgeblich sind die Betroffenen selbst oder, bei fehlender Einwilligungsfähigkeit, ihr vorab geäußerter oder mutmaßlicher Wille. Angehörige werden einbezogen, entscheiden aber nicht allein.",
  m: "Ziele gemeinsam festlegen, dokumentieren und regelmäßig überprüfen.",
  s: ["LL", "BGB1827"] },

{ c: "grund", k: ["leitlinie", "konsens"],
  q: "Wie sollten belastende Symptome in der Palliativversorgung erfasst werden?",
  o: ["Als Selbsteinschätzung mit einem einfachen Instrument wie ESAS, regelmäßig und im Verlauf verglichen.",
      "Durch den Eindruck der Pflegekräfte, der in der Pflegeübergabe knapp mündlich weitergegeben und notiert wird.",
      "Einmal bei der Aufnahme, weil sich die Beschwerden danach kaum noch verändern werden.",
      "Schmerzen lassen sich gut messen, bei anderen Symptomen genügt das Gespräch."],
  a: [0],
  e: "Die Selbstauskunft ist der Maßstab, weil Dritte Symptome häufig unter- oder überschätzen. Das Edmonton Symptom Assessment System (ESAS) ist ein verbreitetes Beispiel. Für Menschen, die sich nicht äußern können, gibt es Beobachtungsinstrumente.",
  m: "Selbstauskunft zuerst, standardisiert und wiederholt.",
  s: ["LL", "ESAS"] },

{ c: "grund", k: ["leitlinie", "uneinheitlich"],
  q: "Für welche Patientengruppe gilt die S3-Leitlinie „Palliativmedizin“ ausdrücklich?",
  o: ["Für Erwachsene mit einer nicht heilbaren Krebserkrankung, bei anderen Diagnosen ist die Übertragung nicht überall belegt.",
      "Für alle Menschen mit einer lebensbedrohlichen Erkrankung, etwa auch Herzinsuffizienz oder Demenz.",
      "Für Kinder und Jugendliche mit einer lebensverkürzenden Erkrankung und deren Familien, die dauerhaft begleitet werden.",
      "Für Menschen in der Sterbephase, also in den letzten Tagen vor dem erwarteten Tod."],
  a: [0],
  e: "Die Leitlinie nennt Krebserkrankungen als Geltungsbereich. Palliativer Bedarf besteht aber auch bei COPD, Herzinsuffizienz, Demenz, ALS und anderen Erkrankungen. Empfehlungen können dort oft sinnvoll sein, sind aber nicht automatisch gleich gut belegt.",
  m: "Die S3-Leitlinie gilt für Krebserkrankungen. Bei anderen Diagnosen auf eigene Leitlinien oder Expertenempfehlungen achten.",
  u: "Es gibt keine einheitliche Leitlinie für alle Diagnosen. Für nicht-onkologische Erkrankungen gelten teils eigene Leitlinien oder Expertenempfehlungen.",
  s: ["LL", "WHO"] },

{ c: "grund", k: ["konsens"],
  q: "Was ist die „Charta zur Betreuung schwerstkranker und sterbender Menschen in Deutschland“?",
  o: ["Ein gemeinsames Leitbild von Fachgesellschaften und Organisationen, also eine Selbstverpflichtung ohne Gesetzeskraft.",
      "Ein Gesetz, das Mindeststandards für Pflegeheime bei der Versorgung Sterbender verbindlich festlegt.",
      "Eine Gebührenordnung, nach der ambulante Palliativleistungen mit den Krankenkassen abgerechnet werden.",
      "Ein Urteil des Bundesverfassungsgerichts, das die Rechte Sterbender gegenüber Pflegeeinrichtungen und Trägern festlegt und durchsetzt."],
  a: [0],
  e: "Die Charta wurde in einem Prozess unter anderem mit der Deutschen Gesellschaft für Palliativmedizin, dem Deutschen Hospiz- und PalliativVerband und der Bundesärztekammer erarbeitet. Sie formuliert Ziele in fünf Leitsätzen, ist aber nicht rechtsverbindlich.",
  m: "Charta = gemeinsames Leitbild, keine Rechtsnorm.",
  s: ["CHARTA"] },

/* ===== SCHMERZTHERAPIE ===== */
{ c: "schmerz", k: ["konsens"],
  q: "Herr K. (84, fortgeschrittene Demenz) spricht kaum noch. Bei der Körperpflege stöhnt er, wehrt ab und ist nachts unruhig. Sie vermuten Schmerzen. Was ist der sinnvollste nächste Schritt?",
  o: ["Ein Beobachtungsinstrument wie BESD nutzen, den Verlauf dokumentieren und ärztlich besprechen.",
      "Abwarten, denn wenn er wirklich Schmerzen hätte, würde er sich auch deutlich dazu äußern können.",
      "Ihm abends ein Beruhigungsmittel anbieten, damit er besser schläft und ruhiger wird.",
      "Die Tochter nach seinem Schmerzempfinden fragen und es dabei bewenden lassen."],
  a: [0],
  e: "Menschen mit Demenz empfinden Schmerz, können ihn aber oft nicht mehr mitteilen. Unruhe, Abwehr bei der Pflege oder Rückzug sind häufige Hinweise. Ein Beobachtungsinstrument macht die Einschätzung nachvollziehbar, die Ärztin entscheidet über die Therapie. Ein Beruhigungsmittel würde ein mögliches Schmerzproblem nur verdecken. Die Angehörigen zu fragen ist hilfreich, ersetzt aber die strukturierte Erfassung nicht.",
  m: "Unruhe bei Demenz: zuerst Schmerz ausschließen, dann beruhigen.",
  s: ["EAPCDEM"] },

{ c: "schmerz", k: ["leitlinie"],
  q: "Frau M. (79, Brustkrebs mit Knochenmetastasen) erhält morgens und abends ein retardiertes Opioid. Nachmittags hat sie bei der Mobilisation starke Schmerzspitzen. Was fehlt in der Verordnung am ehesten?",
  o: ["Eine schnell wirksame Bedarfsmedikation für Durchbruchschmerzen.",
      "Ein zweites retardiertes Opioid, das zusätzlich nachmittags eingenommen wird.",
      "Eine geplante Therapiepause, damit sich der Körper nicht dauerhaft an das Opioid gewöhnt.",
      "Ein Beruhigungsmittel, das vor jeder Mobilisation vorsorglich verabreicht werden soll."],
  a: [0],
  e: "Dauerschmerz wird mit einer regelmäßigen Basis behandelt, Schmerzspitzen mit schnell wirksamen, nicht retardierten Präparaten. Ein zweites Retardpräparat wirkt zu langsam, Pausen verstärken den Schmerz, und Beruhigungsmittel lindern keinen Schmerz. Wird die Bedarfsmedikation häufig gebraucht, überprüft die Ärztin die Basisdosis.",
  m: "Basis nach der Uhr, Schmerzspitzen mit schnell wirksamer Bedarfsgabe.",
  u: "Dosierungen sind bewusst nicht Teil dieses Quiz. Bitte Leitlinie, Fachinformation und hausinterne Standards verwenden.",
  s: ["LL"] },

{ c: "schmerz", k: ["leitlinie", "konsens"],
  q: "Die Tochter von Herrn B. (88, Lungenkrebs, wach und klar, starke Schmerzen) bittet: „Bitte kein Morphin, davon stirbt er schneller.“ Was ist die fachlich passende Reaktion?",
  o: ["Ihre Sorge ernst nehmen und erklären, dass bei angepasster Dosis keine Lebensverkürzung belegt ist.",
      "Ihr recht geben und das Morphin erst in den allerletzten Lebenstagen einsetzen, wenn es nötig wird.",
      "Erklären, dass Angehörige bei der Medikation grundsätzlich nichts zu sagen haben und das Gespräch beenden.",
      "Das Morphin ohne weiteres Gespräch absetzen, damit sich die Familie nicht weiter belastet fühlt."],
  a: [0],
  e: "Bei sorgfältig an den Schmerz angepasster Dosis gibt es keine belastbaren Hinweise auf eine Lebensverkürzung, unbehandelter Schmerz belastet dagegen deutlich. Maßgeblich ist der Wille von Herrn B. selbst. Die Tochter gehört trotzdem ins Gespräch, denn ihre Angst ist verständlich und lässt sich oft mit Information lindern.",
  m: "Ängste von Angehörigen ernst nehmen, erklären, den Willen der Betroffenen zählen lassen.",
  u: "Die Belege stammen vor allem aus Studien mit niedrig dosierten Opioiden bei Atemnot und Tumorschmerz. Für hohe Dosen in der Sterbephase ist die Studienlage begrenzt.",
  s: ["LL", "COPD"] },

{ c: "schmerz", k: ["leitlinie"],
  q: "Frau S. (86) bekommt seit drei Tagen ein Opioid gegen Tumorschmerzen. Seit vier Tagen kein Stuhlgang, der Bauch ist gebläht, sie isst kaum. Ein Abführmittel ist nicht verordnet. Was ist angemessen?",
  o: ["Ärztlich Rücksprache halten, denn bei Opioidbeginn gehört in der Regel ein Abführmittel dazu.",
      "Mehr Trinken und Trockenpflaumen anbieten, das reicht bei Opioiden in der Regel aus.",
      "Das Opioid vorerst nicht mehr geben, bis der Darm wieder von selbst in Gang kommt.",
      "Ein Klistier nach eigenem Ermessen setzen, damit der Stuhlgang möglichst schnell kommt."],
  a: [0],
  e: "Opioide hemmen die Darmtätigkeit, und dagegen entwickelt sich kaum Toleranz. Deshalb wird von Beginn an vorbeugend ein Abführmittel verordnet. Das Opioid eigenmächtig auszusetzen lässt die Schmerzen zurückkehren. Maßnahmen ohne Anordnung sind riskant, weil vorher ein Darmverschluss ausgeschlossen werden muss.",
  m: "Opioid starten heißt Abführmittel mitverordnen.",
  s: ["LL", "OBST"] },

{ c: "schmerz", k: ["leitlinie", "uneinheitlich"],
  q: "Herr T. (91, stark eingeschränkte Nierenfunktion) bekommt seit Wochen Morphin. Er wird zunehmend schläfrig und verwirrt und zeigt Muskelzuckungen. Woran sollte man denken?",
  o: ["An angereicherte Morphin-Abbauprodukte, deshalb sollte die Ärztin Dosis und Wirkstoff überprüfen.",
      "An eine altersübliche Verwirrtheit, bei der in der Regel keine Maßnahmen nötig sind.",
      "An Entzugserscheinungen, deshalb sollte die Morphindosis kurzfristig deutlich erhöht werden.",
      "An eine Nebenwirkung des Abführmittels, das deshalb am besten sofort abgesetzt wird."],
  a: [0],
  e: "Bei eingeschränkter Nierenfunktion können sich Abbauprodukte von Morphin anreichern und Sedierung, Delir und Muskelzuckungen verursachen. Die Ärztin prüft dann einen Wechsel auf ein besser geeignetes Opioid. Eine Dosiserhöhung würde das Problem verschlimmern.",
  m: "Neue Schläfrigkeit, Verwirrtheit und Zuckungen unter Morphin plus Nierenschwäche: ärztlich melden.",
  u: "Welche Substanz bei welcher Nierenfunktion bevorzugt wird, unterscheidet sich zwischen Quellen. Fachinformation und Apotheke hinzuziehen.",
  s: ["LL"] },

{ c: "schmerz", k: ["leitlinie"],
  q: "Welche Aussage zu Nebenwirkungen von Opioiden ist FALSCH?",
  o: ["Müdigkeit und Übelkeit lassen bei Therapiebeginn oft nach einigen Tagen von selbst nach.",
      "Die Verstopfung bildet sich bei Dauertherapie nach einigen Wochen meist von selbst zurück.",
      "Bei langsamer, am Schmerz orientierter Dosisanpassung ist eine Atemdepression selten.",
      "Vorbeugende Abführmittel werden von Beginn der Therapie an empfohlen."],
  a: [1],
  e: "Die Verstopfung ist die Nebenwirkung, gegen die sich kaum Toleranz entwickelt. Sie bleibt bestehen, solange das Opioid gegeben wird, und braucht dauerhaft Vorbeugung. Müdigkeit und Übelkeit sind dagegen oft nur am Anfang ein Problem.",
  m: "Müdigkeit und Übelkeit gehen oft vorbei, Verstopfung bleibt.",
  s: ["LL"] },

{ c: "schmerz", k: ["verbindlich", "leitlinie"], sn: "Grundsatz der Einwilligung (§ 630d BGB, Patientenrechtegesetz). Fachliche Hinweise: S3-Leitlinie Palliativmedizin.",
  q: "Frau W. (82, Darmkrebs, klar orientiert) lehnt Morphin ab: „Das ist Suchtzeug, das bekommen nur Sterbende.“ Sie hat starke Schmerzen. Was ist hilfreich?",
  o: ["Ihre Befürchtungen erfragen, Gewöhnung und Sucht erklären und gemeinsam Möglichkeiten besprechen.",
      "Das Morphin zerkleinert unter das Essen mischen, damit sie sich nicht aufregt.",
      "Auf die ärztliche Anordnung verweisen und die regelmäßige Einnahme freundlich, aber bestimmt einfordern.",
      "Ihren Wunsch hinnehmen und das Thema Schmerz künftig nicht mehr von sich aus ansprechen."],
  a: [0],
  e: "Wer einwilligungsfähig ist, entscheidet selbst. Eine heimliche Gabe verletzt dieses Selbstbestimmungsrecht und ist nicht zulässig. Ein Gespräch über Ängste, den Unterschied zwischen Gewöhnung und Sucht und über Alternativen bringt oft Bewegung. Das Thema Schmerz bleibt dabei im Gespräch, auch wenn sie zunächst bei ihrer Ablehnung bleibt.",
  m: "Ablehnung ernst nehmen, Ängste erfragen, nie heimlich verabreichen.",
  s: ["LL"] },

{ c: "schmerz", k: ["leitlinie", "uneinheitlich"],
  q: "Herr N. hat starke Tumorschmerzen und bisher keine Schmerzmittel. Was gilt nach der Leitlinie zum WHO-Stufenschema?",
  o: ["Ein direkter Beginn mit niedrig dosiertem Stufe-III-Opioid ist möglich, wenn die Schmerzen es erfordern.",
      "Jede Stufe muss mindestens eine Woche ausgeschöpft sein, bevor die nächste Stufe folgen darf.",
      "Stufe II ist bei Krebsschmerz vorgesehen und sollte vor dem Einsatz von Stufe III zunächst ausgeschöpft werden.",
      "Nichtopioide und Opioide sollten wegen der Wechselwirkungen nicht gemeinsam gegeben werden."],
  a: [0],
  e: "Das Stufenschema ist ein Orientierungsrahmen, kein starres Gesetz. Bei mäßigen bis starken Schmerzen kann Stufe II übersprungen werden. Nichtopioide können ergänzend sinnvoll sein.",
  m: "Stufenschema ist ein Rahmen. Bei starken Schmerzen direkt Stufe III möglich.",
  u: "Empfehlungsgrad und Alternativen (zum Beispiel Tramadol, Tilidin) unterscheiden sich je nach Leitlinie und Fassung. Bitte den Originaltext prüfen.",
  s: ["LL"] },

{ c: "schmerz", k: ["konsens"], sn: "Hinweise der Hersteller (Fachinformation Fentanyl-Pflaster). Keine Leitlinienquelle benannt.",
  q: "Frau R. (85) trägt ein Fentanyl-Pflaster. Sie hat 39 °C Fieber, ist sehr schläfrig und atmet flach. Zum Wärmen liegt ein Heizkissen auf dem Pflaster. Was ist richtig?",
  o: ["Das Heizkissen entfernen, die Ärztin sofort informieren und die Atmung engmaschig beobachten.",
      "Das Pflaster abziehen und sofort ein neues an anderer Stelle aufkleben.",
      "Weiter beobachten, denn Wärme und Fieber haben keinen Einfluss auf die Aufnahme aus dem Pflaster.",
      "Zusätzlich Bedarfsmedikation geben, damit sie wegen des Fiebers nicht unruhig und schmerzgeplagt wird."],
  a: [0],
  e: "Fieber und äußere Wärme können die Aufnahme von Fentanyl aus dem Pflaster erhöhen. Es droht eine Überdosierung mit Schläfrigkeit und Atemdepression. Die Wärmequelle wird entfernt und die Ärztin informiert, die über das weitere Vorgehen entscheidet. Zusätzliche Opioidgaben wären gefährlich.",
  m: "Fentanyl-Pflaster: Fieber und Wärme erhöhen die Aufnahme.",
  s: [] },

{ c: "schmerz", k: ["leitlinie", "uneinheitlich"],
  q: "Herr H. (86) hat ein Magengeschwür in der Vorgeschichte und eine eingeschränkte Nierenfunktion. Gegen Knochenschmerzen wird ein NSAR erwogen. Was trifft zu?",
  o: ["NSAR können Magen und Niere belasten, deshalb ist eine sorgfältige ärztliche Abwägung nötig.",
      "NSAR gelten bei älteren Menschen als besonders sicher, Vorerkrankungen spielen kaum eine Rolle.",
      "NSAR sind bei Tumorschmerz grundsätzlich verboten und werden in der Palliativversorgung nie eingesetzt.",
      "Mit Magenschutz sind NSAR auch bei deutlich eingeschränkter Nierenfunktion unbedenklich."],
  a: [0],
  e: "NSAR können Magen, Niere und Herz-Kreislauf-System belasten, besonders bei älteren Menschen und Vorerkrankungen. Ein Magenschutz schützt die Niere nicht. In bestimmten Situationen können Nichtopioide Opioide ergänzen, der Einsatz wird aber gegen die Risiken abgewogen.",
  m: "NSAR bei Älteren mit Magen- oder Nierenproblemen nur mit Vorsicht und ärztlicher Abwägung.",
  u: "Die Leitlinie spricht zu Nichtopioiden nur offene Empfehlungen („kann“) aus. Die Bewertung einzelner Substanzen unterscheidet sich zwischen Ländern.",

{ c: "schmerz", k: ["leitlinie"],
  q: "Frau P. (77) hat Wirbelsäulenmetastasen und trotz Opioiden Schmerzen bei Bewegung. Was sollte ärztlich zusätzlich geprüft werden?",
  o: ["Eine Strahlentherapie und gegebenenfalls Bisphosphonate oder Denosumab.",
      "Konsequente Bettruhe, damit die Wirbelsäule über lange Zeit vollständig entlastet bleibt.",
      "Der Verzicht auf weitere Schmerztherapie, da Knochenschmerz grundsätzlich nicht behandelbar ist.",
      "Ein Wechsel auf rein pflanzliche Mittel, weil Opioide bei Knochenschmerz nicht wirken."],
  a: [0],
  e: "Bei Knochenmetastasen wirken oft mehrere Bausteine zusammen: Schmerzmittel, lokale Strahlentherapie und knochenstabilisierende Substanzen. Bettruhe verschlechtert Beweglichkeit und Lebensqualität. Neu auftretende Gefühlsstörungen oder Lähmungen sind bei Wirbelsäulenmetastasen ein Alarmzeichen und müssen sofort ärztlich abgeklärt werden.",
  m: "Knochenschmerz: Schmerzmittel plus Strahlentherapie, bei Lähmungszeichen sofort ärztlich.",
  s: ["LL"] },

{ c: "schmerz", k: ["leitlinie", "uneinheitlich"],
  q: "Frau L. (80, Tumor im Becken) hat brennende, einschießende Schmerzen im Bein, die auf ihr Opioid nur teilweise ansprechen. Welche Überlegung ist sinnvoll?",
  o: ["Ein Antikonvulsivum oder Antidepressivum erwägen, mit Blick auf Sedierung und Sturzrisiko.",
      "Ein Entzündungshemmer allein behandelt Nervenschmerzen in der Regel zuverlässig und ausreichend.",
      "Die Opioiddosis ohne ärztliche Prüfung immer weiter steigern, bis die Schmerzen verschwunden sind.",
      "Nur Wärme und Ablenkung anbieten, weil Nervenschmerz nicht medikamentös behandelbar ist."],

{ c: "sterbe", k: ["leitlinie", "konsens"],

      "Eine Infusion anlegen, damit er nicht verdurstet und die Tochter sich keine Vorwürfe machen muss.",
      "Auf Mundpflege verzichten, weil Sterbende von der Trockenheit im Mund meist nichts mehr wahrnehmen und sie nicht stört.",
      "Eine Magensonde legen, um in den letzten Tagen eine ausreichende Ernährung sicherzustellen."],
  a: [0],
  w: ["", "Sterbende verspüren meist keinen Durst. Zusätzliche Flüssigkeit kann Sekret, Ödeme und Atemnot verstärken.", "Mundtrockenheit ist in der Sterbephase besonders belastend. Mundpflege gehört zur Symptomkontrolle.", "Künstliche Ernährung in der Sterbephase ist in der Regel nicht angezeigt und belastet zusätzlich."],
  e: "Parenterale Flüssigkeit in der Sterbephase bringt meist keinen Nutzen und kann belasten. Quälend ist die Mundtrockenheit, und die lässt sich durch Mundpflege lindern.",

  n: "Das ist eine Empfehlung der Fachgesellschaften und der Leitlinie, keine Rechtspflicht. Entscheidend sind der Wille des Patienten und die Einzelsituation. Die ärztliche Basisbetreuung schließt das Stillen von Durst ein, bei Sterbenden gelingt das meist über die Mundpflege.",
  s: ["THIEME_ST", "AERZTEZ"] },

{ c: "sterbe", k: ["konsens"],

  w: ["", "Rasselatmung ist nicht zwingend ein Zeichen von Atemnot oder Leiden. Die meisten Betroffenen sind dabei bewusstseinsgetrübt.", "Absaugen ist belastend und bei Sekret in tieferen Atemwegen wenig wirksam. Zuerst kommen Aufklärung und Lagerung in Betracht, bei belastender Rasselatmung Anticholinergika.", "Es ist umgekehrt. Parenterale Flüssigkeit kann die Sekretbildung steigern und die Rasselatmung verstärken."],
  e: "Ein entspannter, ruhiger Eindruck spricht dafür, dass die Patientin nicht leidet. Für Angehörige ist das Geräusch oft sehr belastend, deshalb gehört die Aufklärung dazu.",
  m: "Rasselatmung ist meist für die Angehörigen belastender als für die Sterbenden. Beobachten, aufklären, lagern, bei Bedarf medikamentös behandeln.",
  n: "Die genannten Maßnahmen entsprechen gängiger Praxis und Fachliteratur. Die Auswahl von Medikamenten und Dosierungen richtet sich nach Leitlinie und hausinterner SOP.",

{ c: "sterbe", k: ["leitlinie"],

{ c: "sterbe", k: ["konsens"], sn: "Gängige Praxis; Medikation und Details nach hausinterner SOP.",

  var cfg = { n: 20, mode: "all", topics: {} };
  CAT_ORDER.forEach(function (k) { cfg.topics[k] = true; });
  var run = null;

  var ICON_OK = '<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="currentColor"/><path d="M7.5 13.5l4 4 7-8" fill="none" stroke="var(--surface)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICON_BAD = '<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="currentColor"/><path d="M8.5 8.5l9 9M17.5 8.5l-9 9" fill="none" stroke="var(--surface)" stroke-width="2.4" stroke-linecap="round"/></svg>';
  var ICON_PART = '<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="currentColor"/><path d="M7.5 13h11" fill="none" stroke="var(--surface)" stroke-width="2.6" stroke-linecap="round"/></svg>';

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function chip(kind) { return '<span class="chip chip-' + kind + '">' + KINDS[kind].label + '</span>'; }
  function multiBadge(q) { return q.multi ? '<span class="multibadge">Mehrere Antworten richtig</span>' : ""; }
  function letter(i) { return String.fromCharCode(65 + i); }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  /* Verlauf (welche Fragen wurden schon gesehen). Browser-Speicher kann fehlen, dann zählt nur die laufende Sitzung. */
  var seen = {};
  (function loadSeen() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (raw) { var arr = JSON.parse(raw); if (Array.isArray(arr)) arr.forEach(function (id) { seen[id] = true; }); }
    } catch (e) { /* kein Speicher verfügbar */ }
  })();
  function saveSeen() {
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(Object.keys(seen))); } catch (e) { /* ignorieren */ }
  }
  /* Falsch beantwortete Fragen werden in späteren Runden bevorzugt wieder eingestreut, bis sie einmal richtig beantwortet wurden. */
  var MISS_KEY = "pq_falsch_v1";
  var missed = {};
  (function loadMissed() {
    try {
      var raw = window.localStorage.getItem(MISS_KEY);
      if (raw) { var arr = JSON.parse(raw); if (Array.isArray(arr)) arr.forEach(function (id) { missed[id] = true; }); }
    } catch (e) { /* kein Speicher verfügbar */ }
  })();
  function saveMissed() {
    try { window.localStorage.setItem(MISS_KEY, JSON.stringify(Object.keys(missed))); } catch (e) { /* ignorieren */ }
  }
  function validIds() { var m = {}; POOL.forEach(function (q) { m[q.id] = true; }); return m; }
  (function cleanSeen() { var v = validIds(); Object.keys(seen).forEach(function (id) { if (!v[id]) delete seen[id]; }); Object.keys(missed).forEach(function (id) { if (!v[id]) delete missed[id]; }); })();

  function selectedPool() {
    if (cfg.mode === "all") return POOL.slice();
    return POOL.filter(function (q) { return cfg.topics[q.c]; });
  }
  function pickQuestions(list, n) {
    var miss = shuffle(list.filter(function (q) { return missed[q.id]; })).slice(0, Math.ceil(n * 0.4));
    var taken = {};
    miss.forEach(function (q) { taken[q.id] = true; });
    var rest = list.filter(function (q) { return !taken[q.id]; });
    var unseen = shuffle(rest.filter(function (q) { return !seen[q.id]; }));
    var old = shuffle(rest.filter(function (q) { return seen[q.id]; }));
    return shuffle(miss.concat(unseen, old).slice(0, n));
  }

  function prepare(list) {
    return list.map(function (q) {
      var opts = q.o.map(function (t, i) {
        return { t: t, ok: q.a.indexOf(i) !== -1, w: q.w && q.w[i] ? q.w[i] : "" };
      });
      var c = {};
      for (var k in q) c[k] = q[k];
      c.opts = shuffle(opts);
      c.multi = q.a.length > 1;
      return c;
    });
  }

  function startRun(list, label) {
    run = { label: label, qs: prepare(list), i: 0, answers: [], sel: [] };
    renderQuestion();
    window.scrollTo(0, 0);
  }

  /* ---------- Startseite ---------- */
  function renderStart() {
    var legend = Object.keys(KINDS).map(function (k) {
      return '<li>' + chip(k) + '<span>' + KINDS[k].text + '</span></li>';
    }).join("");
    var counts = {};
    CAT_ORDER.forEach(function (k) { counts[k] = POOL.filter(function (q) { return q.c === k; }).length; });
    var nChoices = [10, 20, 30].map(function (n) {
      return '<label><input type="radio" name="n" value="' + n + '"' + (cfg.n === n ? " checked" : "") + '><span>' + n + ' Fragen</span></label>';
    }).join("");
    var topics = CAT_ORDER.map(function (k) {
      return '<label class="topic"><input type="checkbox" data-t="' + k + '"' + (cfg.topics[k] ? " checked" : "") + '><span>' + CATS[k] + '</span><span class="cnt">' + counts[k] + '</span></label>';
    }).join("");

    app.innerHTML =
      '<header class="hero">' +
        '<h1>Palliativ-Quiz</h1>' +
        '<p class="lead">Quiz zur palliativen Versorgung im Pflegealltag, zum Üben und Wiederholen. Nach jeder Antwort erfahren Sie, warum sie stimmt und wie verbindlich die Aussage ist.</p>' +
      '</header>' +
      '<section class="panel" aria-labelledby="cfgh">' +
        '<h2 id="cfgh" class="sr-only">Test zusammenstellen</h2>' +
        '<fieldset><legend>Anzahl der Fragen</legend><div class="seg" id="nseg">' + nChoices + '</div></fieldset>' +
        '<fieldset><legend>Testart</legend><div class="seg" id="mseg">' +
          '<label><input type="radio" name="mode" value="all"' + (cfg.mode === "all" ? " checked" : "") + '><span>Vollständiger Test<small>alle Themen</small></span></label>' +
          '<label><input type="radio" name="mode" value="topics"' + (cfg.mode === "topics" ? " checked" : "") + '><span>Nach Themen<small>Auswahl treffen</small></span></label>' +
        '</div></fieldset>' +
        '<fieldset id="topicset"' + (cfg.mode === "all" ? " hidden" : "") + '><legend>Themengebiete</legend>' +
          '<div class="topicbar"><button type="button" class="linkbtn" id="allT">Alle auswählen</button><button type="button" class="linkbtn" id="noneT">Keine auswählen</button></div>' +
          '<div class="topics" id="topics">' + topics + '</div>' +
        '</fieldset>' +
        '<div class="info" id="info" aria-live="polite"></div>' +
        '<div class="notice" role="note"><b>Wichtig</b><p>Nur zum Lernen: keine Behandlungsanweisung, keine ärztliche Anordnung, keine Rechtsberatung. Maßgeblich sind aktuelle Leitlinien, Gesetze und die Standards Ihrer Einrichtung.</p></div>' +
        '<div class="actions"><button class="btn btn-primary" id="go" type="button">Test starten</button></div>' +
        '<div class="resetrow"><button class="linkbtn" id="reset" type="button">Verlauf zurücksetzen</button></div>' +
      '</section>' +
      '<details class="fold">' +
        '<summary>Wie verbindlich ist eine Aussage?</summary>' +
        '<div class="foldbody">' +
          '<p class="small muted">Jede Frage trägt eine Kennzeichnung. So können Sie Recht, Leitlinienempfehlung und Praxiswissen auseinanderhalten. Weicht die Fachlage ab oder ist die Evidenz schwach, steht „Uneinheitlich“ dabei und ein Hinweis erklärt den Grund.</p>' +
          '<ul class="legend">' + legend + '</ul>' +
        '</div>' +
      '</details>' +
      '<details class="fold">' +
        '<summary>Wertung, Hinweise und Quellen</summary>' +
        '<div class="foldbody foot">' +
          '<p><b>Wertung:</b> 1 Punkt je vollständig richtiger Antwort.</p>' +
          '<p>Lernhilfe für die Weiterbildung. Das Quiz nennt bewusst keine Dosierungen. Recherchestand: 22.10.2026. Innerhalb einer Runde kommt keine Frage doppelt vor.</p>' +
          '<p>Die Inhalte stützen sich auf die S3-Leitlinie in der Fassung 2.2 (2020), auf Gesetzestexte, Urteile und Fachartikel. Die 2026 aktualisierte Fassung der Leitlinie habe ich nicht im Volltext geprüft.</p>' +
          '<p>Quellen, die ich nicht verlinken konnte, sind als Literaturangabe ohne Link genannt. Wo keine belastbare Einzelquelle benannt ist, steht das ausdrücklich dabei. Empfehlungsgrade und Details bitte in den Originalen und in Ihren hausinternen Standards nachlesen.</p>' +
          '<p>Schriftarten: Public Sans und Newsreader (SIL Open Font License 1.1), in die Seite eingebettet. Das Quiz lädt beim Aufruf nichts von Dritten nach und speichert den Lernstand nur in Ihrem Browser.</p>' +
        '</div>' +
      '</details>' +
      '<p class="copy">© 2026 Christian Dietze. Alle Rechte vorbehalten.</p>';

    function updateInfo() {
      var list = selectedPool();
      var total = list.length;
      var unseenN = list.filter(function (q) { return !seen[q.id]; }).length;
      var n = Math.min(cfg.n, total);
      var go = document.getElementById("go");
      var info = document.getElementById("info");
      var scope = cfg.mode === "all" ? "alle Themen" : plural(CAT_ORDER.filter(function (k) { return cfg.topics[k]; }).length, "Thema", "Themen");
      if (total === 0) {
        info.innerHTML = '<span>Bitte wählen Sie mindestens ein Thema aus.</span>';
        go.disabled = true;
        go.textContent = "Test starten";
        return;
      }
      go.disabled = false;
      go.textContent = "Test starten (" + n + " Fragen)";
      info.innerHTML =
        '<span>Verfügbar: <b>' + total + '</b> Fragen (' + scope + '). Davon noch nicht gesehen: <b>' + unseenN + '</b>.</span>' +
        '<span class="small muted">Ungesehene Fragen werden bevorzugt.' +
        (cfg.n > total ? ' Für diese Auswahl gibt es nur ' + total + ' Fragen, deshalb wird die Runde kürzer.' : '') + '</span>';
    }

    Array.prototype.forEach.call(app.querySelectorAll('input[name="n"]'), function (r) {
      r.addEventListener("change", function () { cfg.n = parseInt(r.value, 10); updateInfo(); });
    });
    Array.prototype.forEach.call(app.querySelectorAll('input[name="mode"]'), function (r) {
      r.addEventListener("change", function () {
        cfg.mode = r.value;
        document.getElementById("topicset").hidden = cfg.mode === "all";
        updateInfo();
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll('input[data-t]'), function (c) {
      c.addEventListener("change", function () { cfg.topics[c.getAttribute("data-t")] = c.checked; updateInfo(); });
    });
    document.getElementById("allT").addEventListener("click", function () {
      CAT_ORDER.forEach(function (k) { cfg.topics[k] = true; });
      Array.prototype.forEach.call(app.querySelectorAll('input[data-t]'), function (c) { c.checked = true; });
      updateInfo();
    });
    document.getElementById("noneT").addEventListener("click", function () {
      CAT_ORDER.forEach(function (k) { cfg.topics[k] = false; });
      Array.prototype.forEach.call(app.querySelectorAll('input[data-t]'), function (c) { c.checked = false; });
      updateInfo();
    });
    var resetBtn = document.getElementById("reset");
    var resetTimer = null;
    resetBtn.addEventListener("click", function () {
      if (resetTimer === null) {
        resetBtn.textContent = "Wirklich zurücksetzen? Zum Bestätigen noch einmal tippen";
        resetTimer = setTimeout(function () {
          resetBtn.textContent = "Verlauf zurücksetzen";
          resetTimer = null;
        }, 6000);
        return;
      }
      clearTimeout(resetTimer);
      resetTimer = null;
      resetBtn.textContent = "Verlauf zurücksetzen";
      seen = {}; saveSeen(); missed = {}; saveMissed(); updateInfo();
    });
    document.getElementById("go").addEventListener("click", function () {
      var list = selectedPool();
      if (!list.length) return;
      var chosen = pickQuestions(list, Math.min(cfg.n, list.length));
      var label = cfg.mode === "all" ? "Vollständiger Test" : "Test nach Themen";
      startRun(chosen, label);
    });
    updateInfo();
  }

  /* ---------- Frage ---------- */
  function renderTopbar() {
    var n = run.qs.length;
    var score = run.answers.filter(function (a) { return a && a.correct; }).length;
    var ticks = "";
    for (var i = 0; i < n; i++) {
      var cls = "tick";
      if (run.answers[i]) cls += run.answers[i].correct ? " ok" : " bad";
      else if (i === run.i) cls += " cur";
      ticks += '<span class="' + cls + '"></span>';
    }
    return '<div class="topbar">' +
      '<div class="topline"><span class="eyebrow">Frage ' + (run.i + 1) + ' von ' + n + '</span>' +
      '<span class="score" aria-live="polite">Punktestand <b>' + score + '</b> von ' + n + '</span></div>' +
      '<div class="ticks" aria-hidden="true">' + ticks + '</div></div>';
  }

  function srcHtml(q) {
    var items = (q.s || []).map(function (key) {
      var s = SRC[key];
      if (!s) return "";
      return s.u
        ? '<li><a href="' + esc(s.u) + '" target="_blank" rel="noopener noreferrer">' + esc(s.t) + '</a></li>'
        : '<li>' + esc(s.t) + ' <span class="muted">(Literaturangabe ohne Link)</span></li>';
    }).join("");
    var note = q.sn ? '<p>' + esc(q.sn) + '</p>' : "";
    if (!items && !note) note = '<p>Keine Einzelquelle angegeben. Die Aussage beruht auf allgemeinem Fachkonsens und sollte bei Bedarf in Lehrbuch oder Standard nachgelesen werden.</p>';
    var nSrc = (items.match(/<li>/g) || []).length;
    var label = 'Quellen und Nachweise' + (nSrc ? ' (' + nSrc + ')' : '');
    return '<details class="mini srcs"><summary>' + label + '</summary><div class="minibody">' + (items ? '<ul>' + items + '</ul>' : "") + note + '</div></details>';
  }

  function einordHtml(q) {
    if (q.n) return '<div class="einord"><div class="row"><span class="eyebrow">Einordnung</span>' + q.k.map(chip).join("") + '</div><p>' + esc(q.n) + '</p></div>';
    return '<div class="einord"><div class="row"><span class="eyebrow">Einordnung</span>' + q.k.map(chip).join("") + '</div>' +
      '<details class="mini"><summary>Was bedeuten die Schilder?</summary><div class="minibody"><ul>' +
      q.k.map(function (k) { return '<li><b>' + KINDS[k].label + ':</b> ' + KINDS[k].short + '</li>'; }).join("") + '</ul></div></details></div>';
  }

  function evalAnswer(q, picked) {
    var correctIdx = [];
    q.opts.forEach(function (o, i) { if (o.ok) correctIdx.push(i); });
    var hits = picked.filter(function (i) { return q.opts[i].ok; }).length;
    var wrongPicked = picked.length - hits;
    var exact = wrongPicked === 0 && hits === correctIdx.length;
    return { correct: exact, hits: hits, wrongPicked: wrongPicked, total: correctIdx.length };
  }

  function renderQuestion() {
    var q = run.qs[run.i];
    var ans = run.answers[run.i];
    var sel = run.sel;
    var optsHtml = q.opts.map(function (o, idx) {
      var cls = "opt";
      var tag = "";
      if (ans) {
        var chosen = ans.picked.indexOf(idx) !== -1;
        if (o.ok) { cls += " right"; tag = chosen ? "✓ Richtig, von Ihnen gewählt" : "✓ Richtig, nicht gewählt"; }
        else if (chosen) { cls += " wrong"; tag = "✗ Falsch, von Ihnen gewählt"; }
        else cls += " dim";
      } else if (sel.indexOf(idx) !== -1) cls += " sel";
      var aria = q.multi && !ans ? ' aria-pressed="' + (sel.indexOf(idx) !== -1) + '"' : "";
      return '<button type="button" class="' + cls + '" data-i="' + idx + '"' + aria + (ans ? " disabled" : "") + '>' +
        '<span class="ltr" aria-hidden="true">' + letter(idx) + '</span><span class="txt">' + esc(o.t) + (tag ? '<span class="tag">' + tag + '</span>' : "") + '</span></button>';
    }).join("");

    var fb = "";
    if (ans) {
      var last = run.i === run.qs.length - 1;
      var verdictCls = ans.correct ? "ok" : (ans.hits > 0 && q.multi ? "part" : "bad");
      var verdictTxt = ans.correct ? "Richtig" : (verdictCls === "part" ? "Teilweise richtig" : "Nicht ganz");
      var icon = ans.correct ? ICON_OK : (verdictCls === "part" ? ICON_PART : ICON_BAD);
      var detail = "";
      if (q.multi && !ans.correct) {
        detail = '<p>Sie haben ' + ans.hits + ' von ' + ans.total + ' richtigen Antworten gewählt' + (ans.wrongPicked ? ' und ' + plural(ans.wrongPicked, "falsche", "falsche") + ' dazu' : '') + '. Für einen Punkt müssen genau die richtigen Antworten gewählt sein.</p>';
      }
      var perOpt = "";
      if (!ans.correct && !q.multi) {
        var wo = q.opts[ans.picked[0]];
        if (wo && wo.w) perOpt = '<p><span class="lbl">Warum Ihre Antwort nicht stimmt:</span> ' + esc(wo.w) + '</p>';
      }
      fb = '<div class="fb" id="fb" tabindex="-1">' +
        '<div class="verdict ' + verdictCls + '">' + icon + verdictTxt + '</div>' +
        '<div class="why">' + detail + perOpt + '<p><span class="lbl">Erklärung:</span> ' + esc(q.e) + '</p></div>' +
        (q.m ? '<div class="merk"><b>Merksatz</b>' + esc(q.m) + '</div>' : "") +
        (q.u ? '<div class="warnbox" role="note"><b>Unsicher oder uneinheitlich</b>' + esc(q.u) + '</div>' : "") +
        (q.h ? '<div class="notebox" role="note"><b>Hinweis</b>' + esc(q.h) + '</div>' : "") +
        einordHtml(q) +
        srcHtml(q) +
        '<div class="actions"><button type="button" class="btn btn-primary" id="next">' + (last ? "Ergebnis anzeigen" : "Nächste Frage") + '</button></div>' +
      '</div>';
    }

    var hint = q.multi
      ? '<b>Hier sind mehrere Antworten richtig.</b> Wählen Sie alle zutreffenden Antworten aus und tippen Sie dann auf „Antwort prüfen“.'
      : 'Wählen Sie eine Antwort.';
    var check = (q.multi && !ans)
      ? '<div class="actions"><button type="button" class="btn btn-primary" id="check"' + (sel.length ? "" : " disabled") + '>Antwort prüfen</button></div>'
      : "";

    app.innerHTML = renderTopbar() +
      '<section class="qcard' + (q.multi ? " multi" : "") + '" aria-labelledby="qt">' +
        '<div class="qmeta">' + multiBadge(q) + q.k.map(chip).join("") + '<span class="small muted">' + CATS[q.c] + '</span></div>' +
        '<h2 class="qtext" id="qt">' + esc(q.q) + '</h2>' +
        (ans ? "" : '<p class="hint' + (q.multi ? " multihint" : "") + '">' + hint + '</p>') +
        '<div class="opts" role="group" aria-labelledby="qt">' + optsHtml + '</div>' +
        check +
        fb +
      '</section>';

    if (!ans) {
      Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (b) {
        b.addEventListener("click", function () {
          var idx = parseInt(b.getAttribute("data-i"), 10);
          if (q.multi) {
            var p = run.sel.indexOf(idx);
            if (p === -1) run.sel.push(idx); else run.sel.splice(p, 1);
            b.classList.toggle("sel", run.sel.indexOf(idx) !== -1);
            b.setAttribute("aria-pressed", String(run.sel.indexOf(idx) !== -1));
            var ck = document.getElementById("check");
            if (ck) ck.disabled = run.sel.length === 0;
          } else {
            submit([idx]);
          }
        });
      });
      var ck = document.getElementById("check");
      if (ck) ck.addEventListener("click", function () { if (run.sel.length) submit(run.sel.slice()); });
    } else {
      document.getElementById("next").addEventListener("click", function () {
        run.sel = [];
        if (run.i < run.qs.length - 1) { run.i++; renderQuestion(); window.scrollTo(0, 0); }
        else { renderResult(); window.scrollTo(0, 0); }
      });
    }
  }

  function submit(picked) {
    var q = run.qs[run.i];
    var ev = evalAnswer(q, picked);
    run.answers[run.i] = { qid: q.id, picked: picked.slice().sort(function (a, b) { return a - b; }), correct: ev.correct, hits: ev.hits, wrongPicked: ev.wrongPicked, total: ev.total };
    seen[q.id] = true;
    saveSeen();
    if (ev.correct) { delete missed[q.id]; } else { missed[q.id] = true; }
    saveMissed();
    renderQuestion();
    var fb = document.getElementById("fb");
    if (fb) {
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      try { fb.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" }); } catch (e) { fb.scrollIntoView(); }
      try { fb.focus({ preventScroll: true }); } catch (e2) { /* ignorieren */ }
    }
  }

  /* ---------- Ergebnis ---------- */
  function tier(pct) {
    if (pct >= 90) return "Sehr sicher. Prüfen Sie bei Gelegenheit noch die Einordnung der Aussagen, besonders bei Recht und Leitlinie.";
    if (pct >= 70) return "Solide Basis mit einzelnen Lücken. Die Hinweise unten zeigen, wo sich das Nachlesen lohnt.";
    if (pct >= 50) return "Mehrere Lücken. Gehen Sie die Merksätze durch und wiederholen Sie die falsch beantworteten Fragen.";
    return "Viele Themen sind noch neu. Das ist in der Weiterbildung normal. Wiederholen Sie die falsch beantworteten Fragen und lesen Sie die verlinkten Quellen.";
  }

  function answerText(q, idxs) {
    return idxs.map(function (i) { return q.opts[i].t; }).join(" / ");
  }
  function correctIdxs(q) {
    var r = [];
    q.opts.forEach(function (o, i) { if (o.ok) r.push(i); });
    return r;
  }

  function renderResult() {
    var n = run.qs.length;
    var score = run.answers.filter(function (a) { return a.correct; }).length;
    var wrongN = n - score;
    var pct = Math.round(score / n * 100);

    var byCat = {};
    run.qs.forEach(function (q, i) {
      var c = byCat[q.c] || (byCat[q.c] = { ok: 0, total: 0 });
      c.total++;
      if (run.answers[i].correct) c.ok++;
    });
    var catHtml = CAT_ORDER.filter(function (k) { return byCat[k]; }).map(function (k) {
      var c = byCat[k];
      var ratio = c.ok / c.total;
      var cls = ratio === 1 ? "full" : (ratio >= 0.6 ? "mid" : "part");
      var label = ratio === 1 ? "Sicher" : (ratio >= 0.6 ? "Teilweise sicher" : "Lücke");
      var w = Math.round(ratio * 100);
      return '<div class="cat"><div class="hd"><span class="nm">' + CATS[k] + '</span>' +
        '<span class="ct"><span class="state ' + cls + '">' + label + '</span> <span class="cnt">' + c.ok + ' von ' + c.total + '</span></span></div>' +
        '<div class="bar" role="img" aria-label="' + c.ok + ' von ' + c.total + ' richtig"><i class="' + cls + '" style="width:' + (w === 0 ? 3 : w) + '%"></i></div></div>';
    }).join("");

    var missed = run.qs.filter(function (q, i) { return !run.answers[i].correct; });
    var gapHtml;
    if (!missed.length) {
      gapHtml = '<p>In diesem Durchgang gab es keine falsche Antwort. Lesen Sie trotzdem die Einordnungen: Gerade bei Recht und Leitlinie kommt es auf die Verbindlichkeit an. Starten Sie eine neue Runde, um weitere Fragen aus dem Pool zu sehen.</p>';
    } else {
      gapHtml = CAT_ORDER.filter(function (k) { return missed.some(function (q) { return q.c === k; }); }).map(function (k) {
        var items = missed.filter(function (q) { return q.c === k; }).map(function (q) {
          var i = run.qs.indexOf(q);
          var a = run.answers[i];
          var youTxt = a.picked.length ? answerText(q, a.picked) : "Keine Antwort";
          return '<article class="gap">' +
            '<div class="qmeta">' + multiBadge(q) + q.k.map(chip).join("") + '</div>' +
            '<h4>' + esc(q.q) + '</h4>' +
            '<div class="pair"><div class="you"><b>Ihre Antwort</b>' + esc(youTxt) + '</div><div class="corr"><b>Richtig</b>' + esc(answerText(q, correctIdxs(q))) + '</div></div>' +
            (q.m ? '<div class="merk"><b>Merksatz</b>' + esc(q.m) + '</div>' : "") +
            (q.u ? '<div class="warnbox" role="note"><b>Unsicher oder uneinheitlich</b>' + esc(q.u) + '</div>' : "") +
            srcHtml(q) +
          '</article>';
        }).join("");
        return '<div class="gapgroup"><h3>' + CATS[k] + '</h3>' + items + '</div>';
      }).join("");
    }

    var review = run.qs.map(function (q, i) {
      var a = run.answers[i];
      return '<div class="rvitem"><span class="mk ' + (a.correct ? "ok" : "bad") + '" aria-label="' + (a.correct ? "richtig" : "falsch") + '">' + (a.correct ? "✓" : "✗") + '</span>' +
        '<div><div class="qq">' + (i + 1) + '. ' + esc(q.q) + '</div>' + (q.multi ? '<div style="margin:4px 0">' + multiBadge(q) + '</div>' : '') +
        '<div class="aa">Ihre Antwort: ' + esc(a.picked.length ? answerText(q, a.picked) : "keine") + '</div>' +
        (a.correct ? "" : '<div class="aa">Richtig: ' + esc(answerText(q, correctIdxs(q))) + '</div>') + '</div></div>';
    }).join("");

    app.innerHTML =
      '<header class="hero">' +
        '<div class="eyebrow">Ergebnis · ' + esc(run.label) + '</div>' +
        '<div class="big"><span class="n">' + score + '</span><span class="of">von ' + n + ' richtig</span><span class="pct">' + pct + ' %</span></div>' +
        '<div class="counts"><span class="pill ok">' + score + ' richtig</span><span class="pill bad">' + wrongN + ' falsch</span><span class="pill neutral">' + n + ' Fragen</span></div>' +
        '<p class="lead">' + tier(pct) + '</p>' +
      '</header>' +
      '<div class="actions">' +
        (missed.length ? '<button type="button" class="btn btn-primary" id="retry">Falsch beantwortete Fragen wiederholen (' + missed.length + ')</button>' : '') +
        '<button type="button" class="btn ' + (missed.length ? "btn-ghost" : "btn-primary") + '" id="again">Neue Runde, gleiche Einstellungen</button>' +
        '<button type="button" class="btn btn-ghost" id="home">Zurück zum Start</button>' +
      '</div>' +
      '<section class="panel" aria-labelledby="cs"><h2 id="cs">Ergebnis nach Themen</h2><div class="cats">' + catHtml + '</div></section>' +
      '<section class="panel" aria-labelledby="gp"><h2 id="gp">Ihre Wissenslücken</h2>' + gapHtml + '</section>' +
      '<details class="review"><summary>Alle Antworten im Überblick (' + n + ')</summary><div class="rv">' + review + '</div></details>' +
      '<p class="foot">Lernhilfe, keine Behandlungsanweisung und keine Rechtsberatung. Maßgeblich sind die aktuelle Leitlinie, die geltenden Gesetze und die Standards Ihrer Einrichtung.</p>';

    var retry = document.getElementById("retry");
    if (retry) retry.addEventListener("click", function () {
      startRun(missed.map(function (q) { return POOL.filter(function (p) { return p.id === q.id; })[0]; }), "Wiederholung falscher Antworten");
    });
    document.getElementById("again").addEventListener("click", function () {
      var list = selectedPool();
      if (!list.length) { renderStart(); return; }
      startRun(pickQuestions(list, Math.min(cfg.n, list.length)), cfg.mode === "all" ? "Vollständiger Test" : "Test nach Themen");
    });
    document.getElementById("home").addEventListener("click", function () { renderStart(); window.scrollTo(0, 0); });
  }

  renderStart();
})();
</script>
</body>
</html>
